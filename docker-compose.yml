services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: building_entry
      POSTGRES_PASSWORD: building_entry
      POSTGRES_DB: building_entry
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "building_entry", "-d", "building_entry"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
